name: tests
on:
  push:
  pull_request:
jobs:
  greenops:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]   # 3.13 is what the judged image runs
    defaults:
      run:
        working-directory: greenops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python compare.py 5
      - run: python -m greenops.play --seeds 2
  image:
    # the judged artifact: the image must build and its entry point must start (--help needs no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t greenops greenops
      - run: docker run --rm --read-only --tmpfs /tmp --cpus 2 --memory 1g greenops --help
  galileo-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python forcegeo/galileo-live/build.py
  greenops-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: greenops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m greenops.experiments --seeds 4 --out /tmp/exp.json
      - run: python -m greenops.export --seed 3 --out /tmp/legacy-run.json
      - run: python -m greenops.export_game --seed 3 --ladder 2 && python ui/build.py && python globe/build.py
      - run: python ../site/build.py --out /tmp/site
